apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-workload
  namespace: scalescope-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-workload
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # HPA Resource/Utilization is always computed against the
          # container's CPU *request* (100m, see deployment.yaml), never
          # the limit - sustained load pushes usage past 60m and triggers
          # scale-out, giving a real HPA baseline to compare against
          # ScaleScope's own recommendations.
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
