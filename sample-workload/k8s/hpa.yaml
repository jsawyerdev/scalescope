apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-workload
  namespace: scalescope-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-workload
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # % of the container's CPU *limit* (200m) - sustained /work load
          # should push utilization past this and trigger scale-out, giving
          # a real HPA baseline to compare against ScaleScope's own
          # recommendations.
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
