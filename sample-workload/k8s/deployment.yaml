apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: scalescope-demo
  labels:
    app: sample-workload
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-workload
  template:
    metadata:
      labels:
        app: sample-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-workload
          # Demo image for the live homelab cluster. Replace this with a
          # registry your own cluster can pull from before applying.
          # imagePullPolicy is Always because :latest is mutable: with
          # IfNotPresent, a node that already cached an older :latest silently
          # keeps running it after a rebuild, push, and rollout restart.
          image: 192.168.1.202:5000/scalescope-sample-workload:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Deliberately tight relative to requests so sustained load
              # against /work reaches the CPU limit and triggers real
              # throttling - this is what lets ScaleScope's diagnosis engine
              # (and a human) observe CPU-limit-throttling conditions rather
              # than only clean scale-up behavior.
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
