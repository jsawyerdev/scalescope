apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: scalescope-demo
  labels:
    app: sample-workload
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-workload
  template:
    metadata:
      labels:
        app: sample-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-workload
          # Published by .github/workflows/image.yml (amd64 and arm64).
          image: ghcr.io/jsawyerdev/scalescope-sample-workload:0.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Deliberately tight relative to requests so sustained load
              # against /work reaches the CPU limit and triggers real
              # throttling - this is what lets ScaleScope's diagnosis engine
              # (and a human) observe CPU-limit-throttling conditions rather
              # than only clean scale-up behavior.
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
