name: Images

# Publishes ghcr.io/<owner>/scalescope and ghcr.io/<owner>/scalescope-sample-workload
# for amd64 and arm64, with SBOM and provenance attestations:
# - every push to main: `main` and `sha-<commit>`;
# - a release (release.yml calls this with `version`, or a `v<version>` tag
#   pushed by hand): `<version>` and `latest`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Release version to publish, without the leading v.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: scalescope
            context: .
          - image: scalescope-sample-workload
            context: sample-workload
    env:
      # Empty unless release.yml called this workflow.
      RELEASE_VERSION: ${{ inputs.version || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch,enable=${{ env.RELEASE_VERSION == '' }}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || env.RELEASE_VERSION != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
