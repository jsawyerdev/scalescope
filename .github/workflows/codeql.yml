name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Third-party minified code, vendored unchanged (see README "License").
          config: |
            paths-ignore:
              - src/scalescope/static/vendor
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
