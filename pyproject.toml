[project]
name = "scalescope"
version = "0.15.0"
description = "Explainable predictive autoscaling for Kubernetes: forecasts demand, sizes pods from each workload's latency curve, and says when scaling will not help"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "James Sawyer", email = "james@jamessawyer.co.uk" },
]
keywords = [
    "kubernetes",
    "autoscaling",
    "forecasting",
    "capacity-planning",
    "queueing",
    "hpa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "polars>=1.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "mlforecast>=0.13",
    "statsforecast>=2.0",
    "kubernetes>=31.0",
    "httpx>=0.27",
    # Imported directly (auth middleware, Kubernetes transport errors), not
    # only through fastapi and kubernetes.
    "starlette>=0.40",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "prometheus-client>=0.21",
]

[project.urls]
Homepage = "https://github.com/jsawyerdev/scalescope"
Documentation = "https://github.com/jsawyerdev/scalescope/blob/main/examples/README.md"
Source = "https://github.com/jsawyerdev/scalescope"
Issues = "https://github.com/jsawyerdev/scalescope/issues"
Changelog = "https://github.com/jsawyerdev/scalescope/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = [
    "src/scalescope",
    "tests",
    "sample-workload/app",
    "scripts/tune",
    "scripts/release_notes.py",
]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ConfigSpace", "ConfigSpace.*", "smac"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "kubernetes.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalescope"]
