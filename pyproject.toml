[project]
name = "scalescope"
version = "0.15.1"
description = "Explainable predictive autoscaling for Kubernetes: forecasts demand, sizes pods from each workload's latency curve, and says when scaling will not help"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "James Sawyer", email = "james@jamessawyer.co.uk" },
]
keywords = [
    "kubernetes",
    "autoscaling",
    "forecasting",
    "capacity-planning",
    "queueing",
    "hpa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "duckdb>=1.5.5",
    "polars>=1.44.2",
    "numpy>=2.5.3",
    # statsforecast 2.1 and mlforecast 1.1 declare pandas<3; 2.3.3 is the
    # newest pandas they support.
    "pandas>=2.3.3",
    "lightgbm>=4.7.0",
    "mlforecast>=1.1.0",
    "statsforecast>=2.1.1",
    "kubernetes>=36.0.3",
    "httpx>=0.28.1",
    # Imported directly (auth middleware, Kubernetes transport errors), not
    # only through fastapi and kubernetes.
    "starlette>=1.7.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "prometheus-client>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/jsawyerdev/scalescope"
Documentation = "https://github.com/jsawyerdev/scalescope/blob/main/examples/README.md"
Source = "https://github.com/jsawyerdev/scalescope"
Issues = "https://github.com/jsawyerdev/scalescope/issues"
Changelog = "https://github.com/jsawyerdev/scalescope/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = [
    "src/scalescope",
    "tests",
    "sample-workload/app",
    "scripts/tune",
    "scripts/release_notes.py",
]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ConfigSpace", "ConfigSpace.*", "smac"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "kubernetes.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalescope"]
