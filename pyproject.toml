[project]
name = "scalescope"
version = "0.5.4"
description = "Explainable predictive Kubernetes capacity intelligence lab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "polars>=1.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "mlforecast>=0.13",
    "statsforecast>=2.0",
    "kubernetes>=31.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src/scalescope"]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "polars.*",
    "statsforecast.*",
    "mlforecast.*",
    "lightgbm.*",
    "pandas.*",
    "kubernetes.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalescope"]
