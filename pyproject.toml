[project]
name = "scalescope"
version = "0.1.0"
description = "Explainable predictive Kubernetes capacity intelligence lab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "polars>=1.14",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlforecast>=0.13",
    "statsforecast>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalescope"]
