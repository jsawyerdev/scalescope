apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalescope
  namespace: scalescope-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scalescope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalescope
    spec:
      serviceAccountName: scalescope
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scalescope
          # Published by .github/workflows/image.yml (amd64 and arm64).
          image: ghcr.io/jsawyerdev/scalescope:0.17.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SCALESCOPE_MODE
              value: observe
            - name: SCALESCOPE_TICK_SECONDS
              value: "5.0"
            - name: SCALESCOPE_DB_PATH
              value: /data/scalescope.duckdb
            # Every Deployment the ServiceAccount can read. Demand is each
            # workload's total CPU (metrics-server) unless request rates
            # are available; see README "Deploy to any cluster".
            - name: SCALESCOPE_K8S_NAMESPACES
              value: "*"
            # Optional per-pod request rates, e.g.
            # http://prometheus-server.monitoring.svc:9090
            # - name: SCALESCOPE_PROMETHEUS_URL
            #   value: ""
            # Node pools are read from the usual managed-cluster labels
            # (Karpenter, EKS, GKE, AKS, DigitalOcean); name another here.
            # - name: SCALESCOPE_NODE_POOL_LABEL
            #   value: my-pool-label
            # Actuation writes replicas for one Deployment; set both of these
            # to it and apply k8s/scalescope-actuation/ before enabling.
            # - name: SCALESCOPE_K8S_NAMESPACE
            #   value: my-namespace
            # - name: SCALESCOPE_K8S_DEPLOYMENT
            #   value: my-deployment
            - name: SCALESCOPE_ACTUATE
              value: "false"
            - name: SCALESCOPE_LOG_LEVEL
              value: INFO
            - name: SCALESCOPE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scalescope-auth
                  key: username
                  optional: true
            - name: SCALESCOPE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scalescope-auth
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scalescope-data
