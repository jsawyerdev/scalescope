apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalescope
  namespace: scalescope-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scalescope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalescope
    spec:
      serviceAccountName: scalescope
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scalescope
          image: 192.168.1.202:5000/scalescope:0.11.1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SCALESCOPE_MODE
              value: observe
            - name: SCALESCOPE_TICK_SECONDS
              value: "5.0"
            - name: SCALESCOPE_DB_PATH
              value: /data/scalescope.duckdb
            - name: SCALESCOPE_K8S_NAMESPACE
              value: scalescope-demo
            - name: SCALESCOPE_K8S_DEPLOYMENT
              value: sample-workload
            - name: SCALESCOPE_K8S_NAMESPACES
              value: "*"
            - name: SCALESCOPE_K8S_METRICS_URL
              value: http://sample-workload.scalescope-demo.svc.cluster.local/metrics
            - name: SCALESCOPE_ACTUATE
              value: "false"
            - name: SCALESCOPE_LOG_LEVEL
              value: INFO
            - name: SCALESCOPE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scalescope-auth
                  key: username
                  optional: true
            - name: SCALESCOPE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scalescope-auth
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scalescope-data
