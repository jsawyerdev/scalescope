apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# `kubectl apply -k k8s/scalescope` installs ScaleScope in OBSERVE mode with
# cluster-wide read access. Override the image or namespace list in an
# overlay, e.g. `kustomize edit set image ghcr.io/jsawyerdev/scalescope=...`.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole-observer.yaml
  - clusterrolebinding-observer.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
