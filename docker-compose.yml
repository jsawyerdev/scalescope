services:
  scalescope:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SCALESCOPE_MODE: demo
      SCALESCOPE_TICK_SECONDS: "2.0"
      SCALESCOPE_LIGHTGBM_CONFIG_PATH: "${SCALESCOPE_LIGHTGBM_CONFIG_PATH:-}"
      SCALESCOPE_AUTH_USERNAME: "${SCALESCOPE_AUTH_USERNAME:-}"
      SCALESCOPE_AUTH_PASSWORD: "${SCALESCOPE_AUTH_PASSWORD:-}"
    volumes:
      - scalescope-data:/data
      - ./scripts/tune/output:/tune-output:ro

  # Real-cluster instance. Opt-in (`docker compose --profile observe up -d`)
  # since it needs a kubeconfig for the scalescope-actuator identity
  # (scripts/generate-observer-kubeconfig.sh, after applying k8s/rbac/) and
  # a route to the workload's own /metrics and /trigger for real
  # request-rate/latency/error-rate and the dashboard's load-generator
  # buttons. SCALESCOPE_K8S_METRICS_URL's default assumes `kubectl
  # port-forward -n <namespace> svc/<name> 18080:80` on the host - fine to
  # start with, but that process has no supervision and dies silently; a
  # LoadBalancer Service's stable IP is more reliable if your cluster can
  # provision one (see .env.example).
  # SCALESCOPE_ACTUATE defaults to false: observing a cluster must never
  # imply writing to it without an explicit opt-in.
  scalescope-observe:
    build: .
    restart: unless-stopped
    profiles: ["observe"]
    ports:
      - "8001:8000"
    environment:
      SCALESCOPE_MODE: observe
      SCALESCOPE_TICK_SECONDS: "2.0"
      SCALESCOPE_K8S_NAMESPACE: "${SCALESCOPE_K8S_NAMESPACE:-scalescope-demo}"
      SCALESCOPE_K8S_DEPLOYMENT: "${SCALESCOPE_K8S_DEPLOYMENT:-sample-workload}"
      SCALESCOPE_K8S_KUBECONFIG: /kubeconfig/observer.kubeconfig
      SCALESCOPE_K8S_METRICS_URL: "${SCALESCOPE_K8S_METRICS_URL:-http://host.docker.internal:18080/metrics}"
      SCALESCOPE_ACTUATE: "${SCALESCOPE_ACTUATE:-false}"
      SCALESCOPE_LIGHTGBM_CONFIG_PATH: "${SCALESCOPE_LIGHTGBM_CONFIG_PATH:-}"
      SCALESCOPE_AUTH_USERNAME: "${SCALESCOPE_AUTH_USERNAME:-}"
      SCALESCOPE_AUTH_PASSWORD: "${SCALESCOPE_AUTH_PASSWORD:-}"
    volumes:
      - scalescope-observe-data:/data
      - ./scripts/tune/output:/tune-output:ro
      - "${SCALESCOPE_OBSERVER_KUBECONFIG:-./scalescope-observer.kubeconfig}:/kubeconfig/observer.kubeconfig:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scalescope-data:
  scalescope-observe-data:
